[project]
name = "docxer"
dynamic = ["version"]
description = "Generate Word documents from JSON data and a styled .docx template"
requires-python = ">=3.10"
dependencies = ["docxtpl>=0.20", "certifi"]

[project.scripts]
docxer = "docxer.cli:main"

[project.optional-dependencies]
dev = ["black", "pyinstaller"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docxer = ["examples/*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.setuptools.dynamic]
version = {attr = "docxer.__version__"}

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds and tests the binaries, no release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, asset: docxer-darwin-arm64 }
          - { os: macos-15-intel, asset: docxer-darwin-x86_64 }
          - { os: ubuntu-22.04, asset: docxer-linux-x86_64 }
          - { os: ubuntu-22.04-arm, asset: docxer-linux-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'\"(.+)\"', pathlib.Path('src/docxer/__init__.py').read_text()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$version"; exit 1; }

      - name: Build binary
        run: |
          pip install . pyinstaller
          pyinstaller --onefile --name docxer \
            --collect-all docxtpl --collect-all docx --collect-data docxer --collect-all certifi \
            packaging/docxer_entry.py

      - name: Smoke test
        run: |
          ./dist/docxer --version
          mkdir smoke && cd smoke
          ../dist/docxer examples
          ../dist/docxer create input.example.json template.example.docx -o out.docx
          test -s out.docx

      - run: cp dist/docxer "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums and version file
        run: |
          cd artifacts
          sha256sum docxer-* > SHA256SUMS
          echo "${GITHUB_REF_NAME#v}" > VERSION
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
